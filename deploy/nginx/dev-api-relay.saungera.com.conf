# Reverse proxy: https://dev-api-relay.saungera.com → http://127.0.0.1:8080
# Installed by scripts/setup-nginx-https.sh

server {
    listen 80;
    listen [::]:80;
    server_name dev-api-relay.saungera.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev-api-relay.saungera.com;

    # Certbot will replace these paths after first issue, or use:
    # ssl_certificate /etc/letsencrypt/live/dev-api-relay.saungera.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev-api-relay.saungera.com/privkey.pem;
    ssl_certificate /etc/letsencrypt/live/dev-api-relay.saungera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api-relay.saungera.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
