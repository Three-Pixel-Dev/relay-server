spring.application.name=relay

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT (override in env for production)
jwt.secret=${JWT_SECRET:relay-dev-secret-change-me-please-32chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.security.mode=${APP_SECURITY_MODE:jwt}

# Comma-separated browser origins allowed for credentialed CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://dev-relay.saungera.com,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Subscription plan prices (USD). Paid via Stripe Checkout (card only).
relay.billing.six-months-price-usd=99
relay.billing.yearly-price-usd=149
relay.billing.currency=usd

# Stripe card Checkout (Embedded, card-only). Leave secret empty to use local free activate in dev.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/connections?stripe=success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/connections?stripe=cancel}

# Google Sign-In — comma-separated OAuth 2.0 client IDs (audiences) allowed to mint ID tokens.
# Include Web, Android, and iOS client IDs from Google Cloud Console.
google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}

# Local file storage for uploaded source documents
relay.storage.root=${RELAY_STORAGE_ROOT:./storage}

# FFmpeg for audio/video source transcription (PATH name "ffmpeg" works on Windows and Linux)
relay.ffmpeg.path=${RELAY_FFMPEG_PATH:ffmpeg}
relay.ffmpeg.ffprobe-path=${RELAY_FFPROBE_PATH:}
relay.ffmpeg.timeout-seconds=${RELAY_FFMPEG_TIMEOUT_SECONDS:300}
relay.ffmpeg.max-duration-seconds=${RELAY_FFMPEG_MAX_DURATION_SECONDS:1800}
relay.ffmpeg.segment-seconds=${RELAY_FFMPEG_SEGMENT_SECONDS:480}

# Video sources: sample frames, skip near-duplicates, cap unique scenes
relay.video.frame-interval-seconds=${RELAY_VIDEO_FRAME_INTERVAL_SECONDS:4}
relay.video.similarity-skip=${RELAY_VIDEO_SIMILARITY_SKIP:0.85}
relay.video.min-scene-gap-seconds=${RELAY_VIDEO_MIN_SCENE_GAP_SECONDS:8}
relay.video.max-scenes=${RELAY_VIDEO_MAX_SCENES:10}

# Auto-bootstrap pgvector extension & HNSW index in dev (set RELAY_PGVECTOR_AUTO_MIGRATE=false in prod and run db/migration/V1__phase1_pgvector_and_sources.sql)
relay.pgvector.auto-migrate=${RELAY_PGVECTOR_AUTO_MIGRATE:true}

# YouTube Data API v3 key for channel/video metadata and captions
youtube.api.key=${YOUTUBE_API_KEY:}

# Market research APIs for Build step 1 (Profitable pockets)
relay.market.marketplace-provider=${RELAY_MARKETPLACE_PROVIDER:auto}
etsy.api.key=${ETSY_API_KEY:}
apify.token=${APIFY_TOKEN:}
apify.etsy-actor-id=${APIFY_ETSY_ACTOR_ID:themineworks~etsy-search-scraper}
relay.market.apify-timeout-seconds=${RELAY_MARKET_APIFY_TIMEOUT_SECONDS:300}
relay.market.keyword-cache-ttl-seconds=${RELAY_MARKET_KEYWORD_CACHE_TTL_SECONDS:86400}
relay.market.google-provider=${RELAY_MARKET_GOOGLE_PROVIDER:serpapi}
serpapi.api.key=${SERPAPI_API_KEY:}
relay.market.etsy-base-url=${RELAY_MARKET_ETSY_BASE_URL:https://openapi.etsy.com/v3/application}
relay.market.serpapi-base-url=${RELAY_MARKET_SERPAPI_BASE_URL:https://serpapi.com/search.json}

# Playwright Chromium web source renderer (serialized for GCP e2-medium; set ws-endpoint for Docker Playwright or install Chromium locally)
relay.web.playwright.ws-endpoint=${RELAY_WEB_PLAYWRIGHT_WS_ENDPOINT:}
relay.web.playwright.headless=${RELAY_WEB_PLAYWRIGHT_HEADLESS:true}
relay.web.playwright.timeout-ms=${RELAY_WEB_PLAYWRIGHT_TIMEOUT_MS:30000}
relay.web.playwright.max-concurrent=${RELAY_WEB_PLAYWRIGHT_MAX_CONCURRENT:1}
relay.web.playwright.settle-ms=${RELAY_WEB_PLAYWRIGHT_SETTLE_MS:1500}

# Partners creator scout (YouTube + Instagram via Playwright; Instagram uses Yahoo/DuckDuckGo then profile pages)
relay.scout.max-results=${RELAY_SCOUT_MAX_RESULTS:6}
relay.scout.time-budget-seconds=${RELAY_SCOUT_TIME_BUDGET_SECONDS:70}
relay.scout.cache-minutes=${RELAY_SCOUT_CACHE_MINUTES:60}

# Multipart upload limits (audio sources can be larger than documents)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Redis (required for live AI pricing catalog cache)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Live AI pricing catalog (models.dev api.json, cached in Redis with 6h soft TTL + stale-while-revalidate)
relay.ai.pricing.catalog-url=${RELAY_AI_PRICING_CATALOG_URL:https://models.dev/api.json}
relay.ai.pricing.cache-ttl-seconds=${RELAY_AI_PRICING_CACHE_TTL_SECONDS:21600}

# Spring Mail SMTP (Partners outreach fallback when no Gmail OAuth mailbox). Credentials via env only.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
relay.mail.from=${RELAY_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
# Reads creator replies for SMTP-sent outreach from the same mailbox over IMAP (same username/app password).
relay.mail.reply-sync-enabled=${RELAY_MAIL_REPLY_SYNC_ENABLED:true}
relay.mail.reply-sync-interval-ms=${RELAY_MAIL_REPLY_SYNC_INTERVAL_MS:60000}
relay.mail.imap-host=${RELAY_MAIL_IMAP_HOST:imap.gmail.com}
relay.mail.imap-port=${RELAY_MAIL_IMAP_PORT:993}

# AES-256-GCM token encryption (OAuth refresh/access tokens). Base64-encoded 32-byte key. No Cloud KMS.
relay.token-encryption.key=${RELAY_TOKEN_ENCRYPTION_KEY:}
relay.token-encryption.key-version=${RELAY_TOKEN_ENCRYPTION_KEY_VERSION:1}
relay.token-encryption.previous-key=${RELAY_TOKEN_ENCRYPTION_PREVIOUS_KEY:}
relay.token-encryption.previous-key-version=${RELAY_TOKEN_ENCRYPTION_PREVIOUS_KEY_VERSION:0}

# Gmail OAuth + History API sync (no Pub/Sub / Gmail Watch). Scheduled sync default 60s.
relay.gmail.oauth-client-id=${GMAIL_OAUTH_CLIENT_ID:}
relay.gmail.oauth-client-secret=${GMAIL_OAUTH_CLIENT_SECRET:}
relay.gmail.oauth-redirect-uri=${GMAIL_OAUTH_REDIRECT_URI:http://localhost:8080/api/gmail/oauth/callback}
relay.gmail.frontend-redirect-base=${GMAIL_FRONTEND_REDIRECT_BASE:http://localhost:5173}
relay.gmail.scheduling-enabled=${GMAIL_SCHEDULING_ENABLED:true}
relay.gmail.sync-interval-ms=${GMAIL_SYNC_INTERVAL_MS:60000}
relay.gmail.followup-interval-ms=${GMAIL_FOLLOWUP_INTERVAL_MS:60000}
relay.gmail.sync-lease-seconds=${GMAIL_SYNC_LEASE_SECONDS:90}
relay.gmail.history-max-pages=${GMAIL_HISTORY_MAX_PAGES:20}
relay.gmail.rate-limit-initial-backoff-ms=${GMAIL_RATE_LIMIT_INITIAL_BACKOFF_MS:1000}
relay.gmail.rate-limit-max-backoff-ms=${GMAIL_RATE_LIMIT_MAX_BACKOFF_MS:30000}
relay.gmail.rate-limit-max-attempts=${GMAIL_RATE_LIMIT_MAX_ATTEMPTS:5}
relay.gmail.instance-id=${GMAIL_INSTANCE_ID:}

# Pipeline trace logging (INFO = quiet in prod, DEBUG = [scrape]/[extract]/[ai]/[estimate]/[step] traces)
logging.level.com.expnai.relay.trace=${RELAY_TRACE_LEVEL:INFO}

# Whop (sell on Whop). Use https://sandbox-api.whop.com/api/v1 for staging with sandbox keys.
relay.whop.api-base-url=${WHOP_API_BASE_URL:https://api.whop.com/api/v1}
relay.whop.api-version-date=${WHOP_API_VERSION_DATE:2026-11-20}
relay.whop.timeout-seconds=${WHOP_TIMEOUT_SECONDS:30}
# Public https URL of this API. Whop calls it back (webhooks) and buyers are redirected to it for downloads.
relay.public-api-url=${RELAY_PUBLIC_API_URL:}
