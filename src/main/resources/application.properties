spring.application.name=relay

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT (override in env for production)
jwt.secret=${JWT_SECRET:relay-dev-secret-change-me-please-32chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.security.mode=${APP_SECURITY_MODE:jwt}

# Comma-separated browser origins allowed for credentialed CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://dev-relay.saungera.com,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Subscription plan prices (USD). Paid via Stripe Checkout (card only).
relay.billing.six-months-price-usd=99
relay.billing.yearly-price-usd=149
relay.billing.currency=usd

# Stripe card Checkout (Embedded, card-only). Leave secret empty to use local free activate in dev.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/connections?stripe=success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/connections?stripe=cancel}

# Google Sign-In — comma-separated OAuth 2.0 client IDs (audiences) allowed to mint ID tokens.
# Include Web, Android, and iOS client IDs from Google Cloud Console.
google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}

# Local file storage for uploaded source documents
relay.storage.root=${RELAY_STORAGE_ROOT:./storage}

# Auto-bootstrap pgvector extension & HNSW index in dev (set RELAY_PGVECTOR_AUTO_MIGRATE=false in prod and run db/migration/V1__phase1_pgvector_and_sources.sql)
relay.pgvector.auto-migrate=${RELAY_PGVECTOR_AUTO_MIGRATE:true}

# YouTube Data API v3 key for channel/video metadata and captions
youtube.api.key=${YOUTUBE_API_KEY:}

# Market research APIs for Build step 1 (Profitable pockets)
relay.market.marketplace-provider=${RELAY_MARKETPLACE_PROVIDER:auto}
etsy.api.key=${ETSY_API_KEY:}
apify.token=${APIFY_TOKEN:}
apify.etsy-actor-id=${APIFY_ETSY_ACTOR_ID:themineworks~etsy-search-scraper}
relay.market.apify-timeout-seconds=${RELAY_MARKET_APIFY_TIMEOUT_SECONDS:300}
serpapi.api.key=${SERPAPI_API_KEY:}
relay.market.etsy-base-url=${RELAY_MARKET_ETSY_BASE_URL:https://openapi.etsy.com/v3/application}
relay.market.serpapi-base-url=${RELAY_MARKET_SERPAPI_BASE_URL:https://serpapi.com/search.json}

# Playwright Chromium web source renderer (serialized for GCP e2-medium; set ws-endpoint for Docker Playwright or install Chromium locally)
relay.web.playwright.ws-endpoint=${RELAY_WEB_PLAYWRIGHT_WS_ENDPOINT:}
relay.web.playwright.headless=${RELAY_WEB_PLAYWRIGHT_HEADLESS:true}
relay.web.playwright.timeout-ms=${RELAY_WEB_PLAYWRIGHT_TIMEOUT_MS:30000}
relay.web.playwright.max-concurrent=${RELAY_WEB_PLAYWRIGHT_MAX_CONCURRENT:1}
relay.web.playwright.settle-ms=${RELAY_WEB_PLAYWRIGHT_SETTLE_MS:1500}

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Redis (required for live AI pricing catalog cache)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Live AI pricing catalog (models.dev api.json, cached in Redis with 6h soft TTL + stale-while-revalidate)
relay.ai.pricing.catalog-url=${RELAY_AI_PRICING_CATALOG_URL:https://models.dev/api.json}
relay.ai.pricing.cache-ttl-seconds=${RELAY_AI_PRICING_CACHE_TTL_SECONDS:21600}
